[[app.default.groups]]
title = "Quick Launch"
color = "accent"

[[app.default.groups.buttons]]
label = "Term"
shell = "wt"
icon = "terminal"
color = "warn"

[[app.default.groups.buttons]]
label = "Files"
shell = "explorer"
icon = "folder"
color = "accent"

[[app.default.groups.buttons]]
label = "Browser"
shell = "start https://google.com"
icon = "globe"
color = "accent"

[[app.default.groups.buttons]]
label = "Code"
shell = "code"
icon = "code"
color = "accent"

[[app.default.groups.buttons]]
label = "Copy"
keys = "ctrl+c"
icon = "copy"
color = "idle"

[[app.default.groups.buttons]]
label = "Paste"
keys = "ctrl+v"
icon = "paste"
color = "idle"

[[app.default.groups.buttons]]
label = "Snip"
keys = "super+shift+s"
icon = "camera"
color = "good"

[[app.default.groups.buttons]]
label = "Lock"
shell = "rundll32.exe user32.dll,LockWorkStation"
icon = "lock"
color = "bad"

[[app.default.groups]]
title = "Media & System"
color = "good"
buttons = [
    { label = "Play", keys = "play", icon = "play", color = "good" },
    { label = "Mute", keys = "mute", icon = "mute", color = "bad" },
    { label = "Prev", keys = "prev", icon = "prev", color = "idle" },
    { label = "Next", keys = "next", icon = "next", color = "idle" },
    { label = "Vol+", keys = "volup", icon = "volup", color = "good" },
    { label = "Vol-", keys = "voldown", icon = "voldown", color = "good" },
    { label = "TaskMgr", keys = "ctrl+shift+esc", icon = "activity", color = "warn" },
    { label = "Close", keys = "alt+f4", icon = "close", color = "bad" },
]

[[app.default.groups]]
title = "Window Snap"
color = "accent"
buttons = [
    { label = "SnapLeft", keys = "super+left", icon = "left", color = "accent" },
    { label = "SnapRight", keys = "super+right", icon = "right", color = "accent" },
