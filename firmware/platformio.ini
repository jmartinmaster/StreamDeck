[platformio]
default_envs = esp32s3_ble_touch

; ------------------------------------------------------------------------------
; Environment 1: ESP32-S3 Touchscreen Stream Deck (NimBLE + LVGL)
; Uses a 4MB-safe partition table (huge_app.csv) so it boots on 4MB, 8MB, and
; 16MB ESP32-S3 boards. Increase board_upload.flash_size if needed.
; Add your panel's display + touch driver init in src/main.cpp.
; ------------------------------------------------------------------------------
[env:esp32s3_ble_touch]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    -DDECK_TRANSPORT_BLE=1
    -DUSE_LVGL_UI=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

lib_deps =
    lvgl/lvgl@^8.3.11
    h2zero/NimBLE-Arduino@^1.4.2

; ------------------------------------------------------------------------------
; Environment 2: ESP32-S3 Headless / Physical Buttons over Bluetooth LE
; Works out of the box on any ESP32-S3 (4MB/8MB/16MB) with Serial CLI + BLE.
; ------------------------------------------------------------------------------
[env:esp32s3_ble_buttons]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    -DDECK_TRANSPORT_BLE=1
    -DBUTTON_PIN_0=0
    -I include

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2

; ------------------------------------------------------------------------------
; Environment 3: ESP32-S3 over USB Serial (Wired / Headless)
; Works out of the box on any ESP32-S3 connected to deckd via USB cable.
; ------------------------------------------------------------------------------
[env:esp32s3_serial]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    -DDECK_TRANSPORT_BLE=0
    -DBUTTON_PIN_0=0
    -I include

lib_deps =

; ------------------------------------------------------------------------------
; Environment 4: Generic ESP32 with Physical Buttons over Bluetooth LE
; ------------------------------------------------------------------------------
[env:esp32_ble_buttons]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    -DDECK_TRANSPORT_BLE=1
    -DBUTTON_PIN_0=0
    -I include

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2

; ------------------------------------------------------------------------------
; Environment 5: Generic ESP32 over USB Serial (CDC / UART)
; Works on any standard ESP32 connected via USB without Bluetooth
; ------------------------------------------------------------------------------
[env:esp32_serial]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    -DDECK_TRANSPORT_BLE=0
    -DBUTTON_PIN_0=0
    -I include

lib_deps =
