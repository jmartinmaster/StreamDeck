[platformio]
default_envs = esp32s3_crowpanel_7

; ------------------------------------------------------------------------------
; Environment 1: Elecrow CrowPanel 7.0" ESP32-S3 (Out-of-the-Box RGB + GT911)
; Ready to flash: native 800x480 double-buffered RGB LCD, GT911 touch, LVGL 8.3,
; and NimBLE/USB/Wi-Fi protocol engine. 4MB-safe partition table (huge_app.csv).
; ------------------------------------------------------------------------------
[env:esp32s3_crowpanel_7]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
upload_speed = 921600

build_src_filter =
    +<*>
    -<boards/*>
    +<boards/crowpanel7/*>

build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DBOARD_CROWPANEL_7=1
    -DCORE_DEBUG_LEVEL=1
    -DDECK_TRANSPORT_BLE=1
    -DUSE_LVGL_UI=1
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -I src/boards/crowpanel7

lib_deps =
    lvgl/lvgl@^8.3.11
    h2zero/NimBLE-Arduino@^1.4.2

; ------------------------------------------------------------------------------
; Environment 2: Generic ESP32-S3 Touchscreen Boilerplate (NimBLE + LVGL)
; For custom ESP32-S3 panels: add your display + touch driver in src/main.cpp
; or under src/boards/<panel>/.
; ------------------------------------------------------------------------------
[env:esp32s3_ble_touch]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed = 921600

build_src_filter =
    +<*>
    -<boards/*>

build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    -DDECK_TRANSPORT_BLE=1
    -DUSE_LVGL_UI=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

lib_deps =
    lvgl/lvgl@^8.3.11
    h2zero/NimBLE-Arduino@^1.4.2

; ------------------------------------------------------------------------------
; Environment 3: ESP32-S3 Headless / Physical Buttons over Bluetooth LE
; Works out of the box on any ESP32-S3 (4MB/8MB/16MB) with Serial CLI + BLE.
; ------------------------------------------------------------------------------
[env:esp32s3_ble_buttons]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed = 921600

build_src_filter =
    +<*>
    -<boards/*>

build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    -DDECK_TRANSPORT_BLE=1
    -DBUTTON_PIN_0=0
    -I include

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2

; ------------------------------------------------------------------------------
; Environment 4: ESP32-S3 over USB Serial (Wired / Headless)
; Works out of the box on any ESP32-S3 connected to deckd via USB cable.
; ------------------------------------------------------------------------------
[env:esp32s3_serial]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv

monitor_speed = 115200
