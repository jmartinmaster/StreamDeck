build_src_filter =
    +<*>
    -<boards/*>

build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    -DDECK_TRANSPORT_BLE=0
    -DBUTTON_PIN_0=0
    -I include

lib_deps =

